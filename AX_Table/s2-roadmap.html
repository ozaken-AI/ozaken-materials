async function decrypt(pw){

  var ck=await crypto.subtle.importKey("raw",ckb,{name:"AES-GCM"},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IVC)},ck,b64(CT));
  return new TextDecoder().decode(pt);
}
function render(html){document.open();document.write(html);document.close();}
async function tryPw(pw,silent){
  try{var html=await decrypt(pw);try{sessionStorage.setItem(KEY,pw);}catch(e){}render(html);return true;}
  catch(err){if(!silent)document.getElementById("e").textContent="パスワードが違います";return false;}
}
document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();var v=document.getElementById("pw").value;if(v)tryPw(v,false);});
(function(){try{var c=sessionStorage.getItem(KEY);if(c)tryPw(c,true);}catch(e){}})();
</script>
