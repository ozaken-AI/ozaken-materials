function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function ckFrom(pw){
  var enc=new TextEncoder();
  for(var i=0;i<W.length;i++){
    try{
      var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(W[i].s),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

      return new Uint8Array(ck);
    }catch(e){}
  }
  return null;
}
async function decrypt(pw){
