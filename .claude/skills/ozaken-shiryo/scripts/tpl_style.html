<style>
/* ============================================================
   OZAKEN WEB STYLE — DESIGN SYSTEM v5
   図版主導（figure-first）版。CSSはこのまま維持し、body内だけ差し替える。
   ============================================================ */

/* ============================================================
   OZAKEN WEB STYLE — DESIGN SYSTEM
   ============================================================ */
:root {
  --ink:         #1a1a2e;
  --navy:        #1f3864;
  --navy-deep:   #141d35;
  --azure:       #2e5496;
  --azure-pale:  #d8e4f0;
  --paper:       #eef3fa;
  --white:       #ffffff;
  --red:         #e23744;
  --red-bright:  #ff5d6a;
  --muted:       #6b7a99;

  --font-ja-sans:  'Zen Kaku Gothic New', sans-serif;
  --font-ja-serif: 'Shippori Mincho B1', serif;
  --font-en:       'Hanken Grotesk', sans-serif;

  --max-w: 880px;
  --sec-pad: 5.75rem 1.5rem;
  --radius: 10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-ja-sans);
  font-size: 16px; line-height: 1.9; letter-spacing: 0.01em;
  /* 日本語は文節で折り返す。対応しない環境では素通りするだけ */
  line-break: strict; word-break: auto-phrase;
  color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

[data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 0.65s ease, transform 0.65s ease; }
[data-reveal].visible { opacity: 1; transform: none; }

.inner { max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem; }
.sec-light { background: var(--paper); padding: var(--sec-pad); color: var(--ink); }
.sec-navy  { background: var(--navy);  padding: var(--sec-pad); color: var(--white); }

/* ----- eyebrow ----- */
/* ピル型のチップだと、見出しの前に「もう一つの見出し」が立ってしまう。
   罫線を引いて字間を空けた小さなラベルにすると、見出しへの助走になる */
.eyebrow {
  display: inline-flex; align-items: center; gap: 0.7em;
  font-family: var(--font-en);
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--azure); margin-bottom: 1.1rem;
}
.eyebrow::before {
  content: ''; width: 26px; height: 1px; background: currentColor; opacity: 0.7;
}
.sec-navy .eyebrow { color: var(--azure-pale); }
.hero .eyebrow { color: var(--azure-pale); background: none; padding: 0; }

/* ----- 見出し ----- */
/* **節の見出しは明朝ではなくゴシックの極太。**
   明朝は表紙の題だけに使う。投影したとき、明朝の見出しは細く沈んで
   遠くの席から読めない。極太のゴシックなら、後ろの席でも輪郭が立つ */
.sec-title {
  font-family: var(--font-ja-sans);
  font-size: clamp(1.6rem, 3.4vw, 2.35rem);
  font-weight: 800; line-height: 1.34; letter-spacing: 0.01em;
  margin-bottom: 0.5rem;
}
.sec-sub { font-size: 1rem; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.7; }
.sec-navy .sec-sub { color: rgba(255,255,255,0.7); }

/* ----- kicker ----- */
.kicker {
  font-family: var(--font-ja-serif);
  font-size: 1.08rem; line-height: 1.9; margin-bottom: 2rem;
  padding-left: 1.1rem; border-left: 3px solid var(--azure);
}
.sec-navy .kicker { border-left-color: var(--azure-pale); color: rgba(255,255,255,0.9); }

/* ----- bare ----- */
.bare { margin: 1.5rem 0; }
.bare p { font-size: 0.95rem; line-height: 1.95; }
.sec-navy .bare p { color: rgba(255,255,255,0.8); }
.bare p + p { margin-top: 1rem; }

/* ----- ヒーロー ----- */
/* **左揃え。**視線は左上から始まる。中央に置くと、題・リード文・署名の
   行頭がそれぞれ違う位置に来て、読み手は毎回その行の始まりを探すことになる */
.hero {
  background: var(--navy); padding: 5.5rem 1.5rem 4.5rem;
  text-align: left; color: var(--white);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 60% 25%, rgba(46,84,150,0.55) 0%, transparent 65%);
  pointer-events: none;
}
.texture { position: absolute; inset: 0; opacity: 0.16; pointer-events: none; }
.texture svg { width: 100%; height: 100%; }
.hero .eyebrow { color: var(--white); background: rgba(255,255,255,0.15); }
.hero-title {
  font-family: var(--font-ja-serif);
  font-size: clamp(2rem, 5.2vw, 3.25rem);
  font-weight: 600; line-height: 1.36; letter-spacing: 0.01em;
  margin-bottom: 1.5rem; position: relative;
}
/* 題の中の要になる語。赤で抜くと警告に見えるので、淡い青に下線を引く */
.hero-title .hl {
  color: var(--azure-pale);
  background-image: linear-gradient(var(--azure), var(--azure));
  background-size: 100% 3px; background-position: 0 calc(100% - 0.1em);
  background-repeat: no-repeat; padding-bottom: 0.12em;
}
.hero-copy {
  font-size: 1rem; color: rgba(255,255,255,0.8);
  max-width: 520px; margin: 0 0 2.2rem; line-height: 2; position: relative;
}
/* 著者と所属。区切りは記号ではなく、細い縦の罫で入れる */
.hero-meta {
  position: relative; z-index: 3;
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.9em;
  font-size: 0.82rem; color: rgba(216,228,240,0.72);
}
.hero-meta b { font-weight: 700; color: #fff; }
.hero-meta span { position: relative; padding-left: 0.9em; }
.hero-meta span::before {
  content: ''; position: absolute; left: 0; top: 0.2em; bottom: 0.2em;
  width: 1px; background: rgba(216,228,240,0.32);
}
/* 右上の区分。明朝のイタリックで、本文とは別の層に見せる */
.hero-cat {
  position: absolute; top: 1.7rem; right: 2rem; z-index: 3;
  font-family: var(--font-ja-serif); font-style: italic;
  font-size: 0.82rem; letter-spacing: 0.04em; color: rgba(216,228,240,0.6);
}
@media (max-width: 640px) { .hero-cat { display: none; } }
.hero-glyph { position: relative; max-width: 640px; margin: 0 auto; }
.hero-glyph svg { width: 100%; height: auto; display: block; }

/* ----- figure / diagram ----- */
/* 白い箱を、もう少し大きな角丸と深い影に。
   図版は資料の主役なので、面から浮いて見えるだけの重さを持たせる */
.figure {
  background: var(--white); border-radius: 14px;
  padding: 2.1rem 2.1rem 1.5rem;
  box-shadow: 0 18px 44px -22px rgba(20,29,53,0.34);
  border: 1px solid rgba(46,84,150,0.07);
  margin: 2.2rem 0 0;
}
.sec-navy .figure {
  background: var(--navy-deep); box-shadow: none;
  border-color: rgba(216,228,240,0.10);
}
@media (max-width: 640px) { .figure { padding: 1.4rem 1.1rem 1rem; } }
.figure-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.figure svg { width: 100%; height: auto; display: block; }
.figure text { font-family: var(--font-ja-sans); }
/* **全部大文字にしない。**日本語の文に大文字化を掛けると、
   中の英数字だけが浮いて読みにくくなる（build_page.check_tokens が
   BUILD_PAGE.CHECK_TOKENS になる、という具合に） */
.figure-cap {
  font-family: var(--font-ja-sans); font-size: 0.78rem; font-weight: 400;
  letter-spacing: 0.01em; line-height: 1.85;
  color: var(--muted); margin-top: 1.1rem; text-align: center;
  max-width: 720px; margin-left: auto; margin-right: auto;
}
.sec-navy .figure-cap { color: rgba(255,255,255,0.55); }
.fig-title {
  font-family: var(--font-ja-sans); font-size: 1.02rem; font-weight: 700;
  line-height: 1.6;
  margin-bottom: 1.1rem; padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--azure-pale);
}
/* 図番号だけ、明朝のイタリックへ逃がす。番号と題が同じ強さだと、
   投影したときに題のほうが読まれない */
.fig-no {
  font-family: var(--font-ja-serif); font-style: italic; font-weight: 600;
  color: var(--azure); margin-right: 0.7em;
}
.sec-navy .fig-title { color: var(--white); border-bottom-color: rgba(255,255,255,0.15); }
.sec-navy .fig-no { color: var(--azure-pale); }
.legend { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; }
.legend-item { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; color: var(--muted); }
.sec-navy .legend-item { color: rgba(255,255,255,0.6); }
.legend-swatch { width: 22px; height: 3px; border-radius: 2px; }

/* ----- 数値ストリップ ----- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-top: 2rem; }
.stat {
  background: var(--white); border-radius: var(--radius);
  padding: 1.3rem 1rem; text-align: center;
  box-shadow: 0 2px 8px rgba(26,26,46,0.07); border-top: 3px solid var(--azure);
}
.sec-navy .stat { background: var(--navy-deep); box-shadow: none; }
.stat-num {
  font-family: var(--font-en); font-size: 2rem; font-weight: 700;
  line-height: 1.1; color: var(--azure);
}
.sec-navy .stat-num { color: var(--azure-pale); }
.stat-num small { font-size: 0.9rem; font-weight: 600; }
.stat-label { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.6; }
.sec-navy .stat-label { color: rgba(255,255,255,0.65); }

/* ----- ステッパー ----- */
.stepper { display: flex; flex-direction: column; gap: 1.25rem; }
.step {
  display: flex; gap: 1.25rem; align-items: flex-start;
  background: var(--white); border-radius: var(--radius);
  padding: 1.4rem 1.7rem; border-left: 4px solid var(--azure);
  box-shadow: 0 2px 8px rgba(26,26,46,0.06);
}
.sec-navy .step { background: var(--navy-deep); box-shadow: none; }
.step-num {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
  background: var(--azure); color: var(--white);
  font-family: var(--font-en); font-size: 0.9rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 2px;
}
.step-body h3 { font-family: var(--font-ja-serif); font-size: 1.03rem; font-weight: 500; margin-bottom: 0.3rem; }
.step-body p { font-size: 0.88rem; line-height: 1.8; color: var(--muted); }
.sec-navy .step-body p { color: rgba(255,255,255,0.68); }

/* ----- カード ----- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.25rem; }
.card {
  background: var(--white); border-radius: var(--radius);
  padding: 1.4rem 1.6rem; box-shadow: 0 2px 8px rgba(26,26,46,0.07);
  border-top: 3px solid var(--azure);
}
.sec-navy .card { background: var(--navy-deep); box-shadow: none; }
.card-icon { width: 36px; height: 36px; margin-bottom: 0.85rem; color: var(--azure); }
.sec-navy .card-icon { color: var(--azure-pale); }
.card h3 { font-family: var(--font-ja-sans); font-size: 1.02rem; font-weight: 700;
  line-height: 1.6; margin-bottom: 0.5rem; }
.card p { font-size: 0.85rem; line-height: 1.85; color: var(--muted); }
.sec-navy .card p { color: rgba(255,255,255,0.68); }
/* **番号は添え物ではなく、主役。**小さなチップだと、3枚の順番が読み取れない。
   大きく置くと「01 から順に読むもの」だと一目で分かる */
.card-tag {
  display: block; font-family: var(--font-en);
  font-size: 1.55rem; font-weight: 700; letter-spacing: 0.02em; line-height: 1;
  color: var(--azure); background: none; padding: 0; margin-bottom: 0.7rem;
}
.sec-navy .card-tag { color: var(--azure-pale); background: none; }
/* カードの下端に、細い進みの帯。3枚並んだときの視線の終点になる */
.card { position: relative; overflow: hidden; padding-bottom: 1.7rem; }
.card::after {
  content: ''; position: absolute; left: 1.6rem; right: 1.6rem; bottom: 1rem; height: 3px;
  border-radius: 2px; background: var(--azure-pale);
}
.sec-navy .card::after { background: rgba(255,255,255,0.14); }

/* ----- VS比較 ----- */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: stretch; }
.vs-card { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 8px rgba(26,26,46,0.07); }
.sec-navy .vs-card { background: var(--navy-deep); box-shadow: none; }
.vs-badge {
  font-family: var(--font-en); font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 0.7rem;
}
.vs-badge.pos { background: var(--azure-pale); color: var(--azure); }
.vs-badge.neg { background: #fde8ea; color: var(--red); }
.sec-navy .vs-badge.neg { background: rgba(226,55,68,0.2); color: var(--red-bright); }
.vs-label {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--azure); color: var(--white);
  font-family: var(--font-en); font-size: 0.8rem; font-weight: 700;
  flex-shrink: 0; margin: auto;
}
.vs-card h3 { font-family: var(--font-ja-serif); font-size: 1.03rem; font-weight: 500; margin-bottom: 0.45rem; }
.vs-card p { font-size: 0.86rem; line-height: 1.8; color: var(--muted); }
.sec-navy .vs-card p { color: rgba(255,255,255,0.68); }
.vs-meta {
  margin-top: 0.9rem; padding-top: 0.8rem;
  border-top: 1px dashed rgba(46,84,150,0.3);
  font-size: 0.78rem; line-height: 1.75; color: var(--muted);
}
.sec-navy .vs-meta { border-top-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.6); }
.vs-meta b { font-family: var(--font-en); color: var(--azure); font-weight: 700; }
.sec-navy .vs-meta b { color: var(--azure-pale); }

/* ----- 深掘り ----- */
.deep {
  background: var(--navy-deep); border-radius: var(--radius);
  padding: 1.9rem 2.1rem; border-left: 4px solid var(--azure); margin: 1.75rem 0;
}
.deep h3 { font-family: var(--font-ja-serif); font-size: 1.12rem; font-weight: 500; margin-bottom: 0.7rem; color: var(--white); }
.deep p { font-size: 0.89rem; line-height: 1.85; color: rgba(255,255,255,0.75); }
.deep p + p { margin-top: 0.85rem; }
/* 曼荼羅の実作例 */
.mandala { display: grid; grid-template-columns: minmax(0,300px) minmax(0,1fr); gap: clamp(1.2rem,3vw,2.2rem); align-items: start; background: var(--navy-deep); border-radius: var(--radius); padding: clamp(1.2rem,3vw,1.8rem); margin-bottom: 1.6rem; }
.mandala figure { margin: 0; }
.mandala img { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 16px 40px -14px rgba(0,0,0,0.7); }
.mandala figcaption { margin-top: 0.6rem; font-size: 0.7rem; line-height: 1.7; color: rgba(255,255,255,0.5); }
.mandala figcaption a { color: rgba(216,228,240,0.75); }
.mandala-body h3 { font-family: var(--font-ja-serif); font-size: 1.12rem; font-weight: 500; margin-bottom: 0.7rem; color: var(--white); }
.mandala-body p { font-size: 0.89rem; line-height: 1.85; color: rgba(255,255,255,0.75); }
.mandala-body p + p { margin-top: 0.85rem; }
.mandala-body b { color: var(--white); }
@media (max-width: 720px) { .mandala { grid-template-columns: 1fr; } }

/* ----- 計算ブロック ----- */
.calc {
  background: rgba(255,255,255,0.06);
  border: 1px dashed rgba(255,255,255,0.25);
  border-radius: var(--radius-sm);
  padding: 1.1rem 1.3rem; margin: 1.5rem 0;
  font-family: var(--font-en); font-size: 0.95rem; line-height: 1.8;
  color: var(--white); text-align: center; letter-spacing: 0.02em;
}
.calc b { color: var(--red-bright); font-size: 1.15rem; }
.calc span { font-size: 0.76rem; color: rgba(255,255,255,0.6); display: block; font-family: var(--font-ja-sans); letter-spacing: 0; }

/* ----- 2カラム ----- */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
@media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
.two-col-item h3 {
  font-family: var(--font-ja-serif); font-size: 1.02rem; font-weight: 500;
  margin-bottom: 0.55rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--azure);
}
.two-col-item p { font-size: 0.88rem; line-height: 1.85; color: var(--muted); }
.sec-navy .two-col-item p { color: rgba(255,255,255,0.72); }

/* ----- 注記 ----- */
.note {
  font-size: 0.82rem; color: var(--muted); line-height: 1.8;
  padding: 0.85rem 1.1rem; border-left: 3px solid var(--azure-pale);
  background: rgba(46,84,150,0.04);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-top: 1.75rem;
}
.sec-navy .note { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05); border-left-color: rgba(255,255,255,0.25); }

/* ----- まとめ ----- */
.summary { text-align: center; max-width: 660px; margin: 0 auto; }
.summary-text {
  font-family: var(--font-ja-serif);
  font-size: clamp(1.12rem, 3vw, 1.45rem);
  font-weight: 400; line-height: 1.95;
}

/* ----- take ----- */
.take {
  background: var(--navy-deep); border-radius: var(--radius);
  padding: 1.6rem 1.9rem; display: flex; gap: 1.5rem; align-items: center;
  margin: 2rem 0 0; border-left: 4px solid var(--red); width: 100%;
}
/* 中身は残りいっぱいに広がる。横長の帯として読ませる */
.take-body { flex: 1 1 auto; min-width: 0; }
.sec-light .take { background: #fff8f8; border-left: 4px solid var(--red); box-shadow: 0 2px 8px rgba(226,55,68,0.07); }
.take-avatar {
  flex-shrink: 0; width: 68px; height: 68px; border-radius: 50%;
  background: var(--azure); color: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-en); font-size: 0.75rem; font-weight: 700;
  object-fit: cover; border: 2px solid rgba(255,255,255,0.22);
}
.sec-light .take-avatar { border-color: rgba(226,55,68,0.22); }
@media (max-width: 640px) {
  .take { gap: 1rem; padding: 1.3rem 1.2rem; align-items: flex-start; }
  .take-avatar { width: 48px; height: 48px; }
}
.take-label {
  font-family: var(--font-en); font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--red-bright); margin-bottom: 4px;
}
.sec-light .take-label { color: var(--red); }
.take-author { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 0.45rem; }
.sec-light .take-author { color: var(--muted); }
.take-text { font-size: 0.89rem; line-height: 1.85; color: rgba(255,255,255,0.88); }
.sec-light .take-text { color: var(--ink); }
.hot { color: var(--red-bright); font-weight: 700; }
.sec-light .hot { color: var(--red); }

.text-azure { color: var(--azure); }
.text-red { color: var(--red); }
/* 暗い面では #e23744 が地に沈む。表紙の強調と同じ明るい赤に替える */
.sec-navy .text-red, .sec-download .text-red { color: var(--red-bright); }
.sec-navy .text-azure, .sec-download .text-azure { color: var(--azure-pale); }
.fw-bold { font-weight: 700; }

footer {
  background: var(--navy-deep); padding: 3rem 1.5rem; text-align: center;
  color: rgba(255,255,255,0.5); font-size: 0.8rem;
}

@media (max-width: 720px) {
  .figure-scroll svg { min-width: 560px; }
  .figure-scroll::after { content: ''; display: block; }
}
@media (max-width: 640px) {
  :root { --sec-pad: 3.5rem 1rem; }
  .vs { grid-template-columns: 1fr; }
  .vs-label { display: none; }
  .hero { padding: 4rem 1rem 3.5rem; }
  .deep { padding: 1.5rem 1.4rem; }
  .figure { padding: 1.4rem 1rem 1rem; }
}


/* ── 日本語の折り返し ──
   ぶら下がりや行末の1文字残りは、読み手には「詰まって見える」だけで
   意味のある区切りではない。本文は文節で、見出しは行の長さを均して折る。 */
p, li, .sec-sub, .lede, .note, .card p, .take-text, .figure-cap, .hero-copy,
.close-copy, .vs-card p, .deep p, .step-body p { text-wrap: pretty; }
.hero-title, .sec-title, .close-title, .card h3, .vs-card h3 { text-wrap: balance; }
/* リード文は、長すぎる行を作らない。1行が長いほど、次の行頭を見失う */
.lede { max-width: 760px; }

/* レイヤー0：点の格子。べた塗りの面に、わずかな奥行きを出す。
   動かさない。動くのはレイヤー1のグローだけで十分で、
   両方が動くと図版のほうが読みにくくなる */
.sec-navy::after, .hero::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(159,198,245,0.16) 1px, transparent 1px);
  background-size: 22px 22px;
}
.sec-light::after, .sec-download::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(46,84,150,0.10) 1px, transparent 1px);
  background-size: 26px 26px;
}
/* **.hero > * は書かない。**
   ヒーローは縦のフレックスで、中の .texture は position:absolute で敷いてある。
   子孫にまとめて position:relative を当てると、その absolute を上書きしてしまい、
   星座のSVGがフレックスの一員として場所を取り、題が画面の下へ押し出される。
   中身の重なりは apply_herofx の .hero .inner{z-index:3} が面倒を見ている */

/* ── アンビエント：背景がゆっくり常時ドリフト（全セクション） ── */
.sec-light, .sec-navy, .sec-download { position: relative; overflow: hidden; }
.sec-light > *, .sec-navy > *, .sec-download > * { position: relative; z-index: 1; }
/* レイヤー1：淡いグロー（にじむ光がドリフト） */
.sec-light::before, .sec-navy::before, .sec-download::before {
  content: ''; position: absolute; inset: -25%; z-index: 0; pointer-events: none;
  will-change: transform;
}
.sec-navy::before {
  background:
    radial-gradient(44% 48% at 14% 18%, rgba(58,102,178,0.62), transparent 68%),
    radial-gradient(36% 40% at 86% 26%, rgba(255,93,106,0.20), transparent 70%),
    radial-gradient(54% 58% at 72% 92%, rgba(46,84,150,0.50), transparent 72%);
  animation: ambientDrift 20s ease-in-out infinite alternate;
}
.sec-light::before, .sec-download::before {
  background:
    radial-gradient(46% 50% at 8% 14%, rgba(46,84,150,0.28), transparent 70%),
    radial-gradient(42% 46% at 92% 86%, rgba(255,93,106,0.15), transparent 72%),
    radial-gradient(40% 44% at 60% 50%, rgba(46,84,150,0.18), transparent 74%);
  animation: ambientDrift 26s ease-in-out infinite alternate;
}
.sec-download::before { animation-duration: 31s; }
/* レイヤー2：パーティクル・ネットワーク（点が漂い、近い点同士が線でつながる） */
.net-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; display: block; }
@keyframes ambientDrift {
  0%   { transform: translate3d(-4%, -3%, 0) scale(1.08); }
  100% { transform: translate3d(5%,   4%,  0) scale(1.20); }
}
@media (prefers-reduced-motion: reduce) {
  .sec-light::before, .sec-navy::before, .sec-download::before { animation: none; }
  .net-canvas { display: none; }
}

/* ── 図版アニメーション ──
   .figanim は起動スクリプトが <html> に付ける。JSが動かない環境では初期状態を伏せず、
   図がそのまま表示される（プログレッシブ・エンハンスメント）。
   遅延は各要素の style="--d:.4s" で指定する。 */
.figanim .figure svg .a-fade,
.figanim .figure svg .a-pop,
.figanim .figure svg .a-grow,
.figanim .figure svg .a-rise,
.figanim .hero-glyph svg .a-fade,
.figanim .hero-glyph svg .a-pop,
.figanim .hero-glyph svg .a-rise { opacity: 0; }
/* 線を引く演出：JSが実長を測ってdasharray/offsetを入れ、発火時にoffsetを0へ戻す。
   矢印マーカーは要素のopacityに従うので、線が引き終わる頃に浮かび上がる */
.figanim .figure svg .a-draw,
.figanim .hero-glyph svg .a-draw {
  opacity: 0;
  transition: stroke-dashoffset 1.05s cubic-bezier(0.4,0,0.2,1) var(--d,0s),
              opacity 0.45s ease calc(var(--d,0s) + 0.5s);
}
.figanim .figure.anim-on svg .a-draw,
.figanim .hero-glyph.anim-on svg .a-draw { opacity: 1; }
.figanim .figure.anim-on svg .a-fade,
.figanim .hero-glyph.anim-on svg .a-fade { animation: figFade 0.55s ease var(--d,0s) both; }
/* a-pop は <g> にも掛けるため、transform-box:fill-box（コンテナ要素への対応が新しい）に頼らず
   viewBox座標で原点を指定する。各要素が style="--o:320px 90px" で中心を渡す */
.figanim .figure.anim-on svg .a-pop,
.figanim .hero-glyph.anim-on svg .a-pop {
  animation: figPop 0.5s cubic-bezier(0.34,1.28,0.64,1) var(--d,0s) both;
  transform-box: view-box; transform-origin: var(--o, center);
}
.figanim .figure.anim-on svg .a-grow {
  animation: figGrow 0.85s cubic-bezier(0.4,0,0.2,1) var(--d,0s) both;
  transform-box: fill-box; transform-origin: left center;
}
/* figFadeは不透明度のみを動かす。SVGのtransform属性（軸ラベルのrotateなど）を壊さないため */

/* 箱は、下からすっと上がって出る。フェードだけだと、
   要素が多い図で「何がどこに置かれたか」が追えない */
.figanim .figure.anim-on svg .a-rise,
.figanim .hero-glyph.anim-on svg .a-rise {
  animation: figRise 0.62s cubic-bezier(0.22,1,0.36,1) var(--d,0s) both;
  transform-box: view-box;
}
@keyframes figRise {
  from { opacity: 0; transform: translateY(13px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes figFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes figPop  { from { opacity: 0; transform: scale(0.62); } to { opacity: 1; transform: scale(1); } }
/* figGrowは伏せた初期状態(opacity:0)を自分で解除する。transformだけ動かすと透明のまま残るため */
@keyframes figGrow { from { opacity: 1; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }

/* ── 出たあとも動き続けるもの ──
   投影中に気が散らないよう、どれもゆっくり・小さく。
   .a-flow は矢印と破線が流れる。.a-breathe は色帯や点がゆっくり息をする。
   .a-pulse は大きめの丸がゆっくり脈打つ。
   キーフレーム名は oz- で始める。資料ごとに定義の違う figFade を借りると、
   その定義を持たない資料で opacity:0 のまま消えてしまうため */
.figanim .figure svg .a-flow, .figanim .hero-glyph svg .a-flow,
.figanim .figure svg .a-breathe, .figanim .hero-glyph svg .a-breathe,
.figanim .figure svg .a-pulse, .figanim .hero-glyph svg .a-pulse { opacity: 0; }
.figanim .figure.anim-on svg .a-flow,
.figanim .hero-glyph.anim-on svg .a-flow {
  stroke-dasharray: 9 5;
  animation: ozFxIn 0.55s ease var(--d,0s) both,
             ozFlow 0.9s linear var(--d,0s) infinite;
}
.figanim .figure.anim-on svg .a-breathe,
.figanim .hero-glyph.anim-on svg .a-breathe {
  animation: ozFxIn 0.55s ease var(--d,0s) both,
             ozBreathe 4.2s ease-in-out calc(var(--d,0s) + 0.6s) infinite;
}
.figanim .figure.anim-on svg .a-pulse,
.figanim .hero-glyph.anim-on svg .a-pulse {
  transform-box: fill-box; transform-origin: center;
  animation: ozFxIn 0.55s ease var(--d,0s) both,
             ozPulse 3.4s ease-in-out calc(var(--d,0s) + 0.6s) infinite;
}
@keyframes ozFxIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes ozFlow { to { stroke-dashoffset: -14; } }
@keyframes ozBreathe { 0%,100% { opacity: 1; } 50% { opacity: 0.62; } }
@keyframes ozPulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); opacity: 0.84; }
}
@media (prefers-reduced-motion: reduce) {
  .figanim .figure svg .a-flow, .figanim .hero-glyph svg .a-flow,
  .figanim .figure svg .a-breathe, .figanim .hero-glyph svg .a-breathe,
  .figanim .figure svg .a-pulse, .figanim .hero-glyph svg .a-pulse,
  .figanim .figure svg .a-fade, .figanim .figure svg .a-pop,
  .figanim .figure svg .a-grow, .figanim .figure svg .a-draw,
  .figanim .figure svg .a-rise, .figanim .hero-glyph svg .a-rise,
  .figanim .hero-glyph svg .a-fade, .figanim .hero-glyph svg .a-pop,
  .figanim .hero-glyph svg .a-draw {
    opacity: 1; animation: none !important; transition: none !important;
  }
}
